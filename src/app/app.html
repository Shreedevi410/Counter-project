<h1>Counter App</h1>
<div style="text-align: center;">
  <h3 class="count">{{count}}</h3>
  <div>
    <button class="btn bg-red" (click)="handleCounter('increment')">Increment</button>
    <button class="btn bg-green" (click)="handleCounter('reset')">Reset</button>
    <button class="btn bg-blue" (click)="handleCounter('decrement')">Decrement</button>
  </div>
</div>
